[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Arc Testnet — primary deployment target
arc_testnet = "${ARC_TESTNET_RPC}"

# Other networks
ethereum     = "https://ethereum-rpc.publicnode.com"
sepolia      = "https://ethereum-sepolia-rpc.publicnode.com"
base         = "https://base-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
arbitrum     = "https://arbitrum-one-rpc.publicnode.com"
polygon      = "https://polygon-bor-rpc.publicnode.com"
optimism     = "https://optimism-rpc.publicnode.com"

[etherscan]
# Arc Testnet block explorer (Blockscout-compatible)
# Leave ETHERSCAN_API_KEY blank — Blockscout does not require an API key for verification
arc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.testnet.arc.io/api" }
